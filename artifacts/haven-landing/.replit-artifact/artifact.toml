kind = "web"
previewPath = "/"
title = "Haven Landing Page"
version = "1.0.0"
id = "artifacts/haven-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24557

[services.development]
run = "pnpm --filter @workspace/haven-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/haven-landing", "run", "build" ]
publicDir = "artifacts/haven-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24557"
BASE_PATH = "/"
